name: DeployFlow CI/CD Pipeline

on:
  push:
    branches: [ main ]

env:
  DOCKER_IMAGE: vaibzz7219/deployflow

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run basic tests
        run: |
          python -c "import app.main; print('Test passed')"

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Image
        run: |
          docker build -t vaibzz7219/deployflow:latest .
          docker push vaibzz7219/deployflow:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull vaibzz7219/deployflow:latest
            docker stop deployflow-app || true
            docker rm deployflow-app || true
            docker run -d \
              --name deployflow-app \
              -p 8000:8000 \
              vaibzz7219/deployflow:latest
